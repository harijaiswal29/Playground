<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GitHub Portfolio - Explore all repositories">
    <title>GitHub Portfolio - harijaiswal29</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            padding: 40px 20px;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .profile-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #667eea;
        }

        .profile-info h2 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat {
            text-align: center;
            padding: 10px 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
        }

        .search-filter {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.5rem;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }

        .repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .repo-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .repo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .repo-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .repo-icon {
            font-size: 1.5rem;
        }

        .repo-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #667eea;
            text-decoration: none;
            word-break: break-word;
        }

        .repo-name:hover {
            text-decoration: underline;
        }

        .repo-description {
            color: #666;
            margin-bottom: 15px;
            flex-grow: 1;
            min-height: 40px;
        }

        .repo-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .language-badge {
            display: inline-block;
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .repo-topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .topic-badge {
            padding: 4px 10px;
            background: #f0f0f0;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #555;
        }

        .no-repos {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            opacity: 0.9;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            .profile-section {
                flex-direction: column;
                text-align: center;
            }

            .profile-stats {
                justify-content: center;
            }

            .repos-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 GitHub Portfolio</h1>
            <p>Explore all repositories</p>
        </header>

        <div id="profile-container"></div>

        <div class="search-filter">
            <input type="text" id="search-box" class="search-box" placeholder="🔍 Search repositories by name, description, or language...">
        </div>

        <div id="loading" class="loading">Loading repositories...</div>
        <div id="error" class="error" style="display: none;"></div>
        
        <div id="repos-container" class="repos-grid"></div>

        <footer>
            <p>Built with ❤️ using GitHub API</p>
        </footer>
    </div>

    <script>
        const GITHUB_USERNAME = 'harijaiswal29';
        const GITHUB_API_BASE = 'https://api.github.com';
        const USE_MOCK_DATA = false; // Set to true for testing without API access

        let allRepos = [];

        // Mock data for testing
        const MOCK_USER = {
            login: 'harijaiswal29',
            name: 'Hari Jaiswal',
            avatar_url: 'https://avatars.githubusercontent.com/u/1?v=4',
            bio: 'Software Developer | Open Source Enthusiast',
            location: 'India',
            public_repos: 15,
            followers: 50,
            following: 30
        };

        const MOCK_REPOS = [
            {
                name: 'Playground',
                html_url: 'https://github.com/harijaiswal29/Playground',
                description: 'A playground repository for testing and experiments',
                language: 'Python',
                stargazers_count: 5,
                forks_count: 2,
                watchers_count: 5,
                updated_at: '2026-01-22T16:00:00Z',
                topics: ['playground', 'testing', 'python'],
                license: { name: 'MIT' }
            },
            {
                name: 'awesome-project',
                html_url: 'https://github.com/harijaiswal29/awesome-project',
                description: 'An awesome web application built with modern technologies',
                language: 'JavaScript',
                stargazers_count: 25,
                forks_count: 8,
                watchers_count: 25,
                updated_at: '2026-01-20T10:30:00Z',
                topics: ['web', 'javascript', 'react'],
                license: { name: 'Apache-2.0' }
            },
            {
                name: 'ml-experiments',
                html_url: 'https://github.com/harijaiswal29/ml-experiments',
                description: 'Machine learning experiments and research',
                language: 'Python',
                stargazers_count: 42,
                forks_count: 12,
                watchers_count: 42,
                updated_at: '2026-01-15T14:20:00Z',
                topics: ['machine-learning', 'ai', 'python', 'tensorflow'],
                license: { name: 'MIT' }
            },
            {
                name: 'data-visualizer',
                html_url: 'https://github.com/harijaiswal29/data-visualizer',
                description: 'Interactive data visualization tool',
                language: 'TypeScript',
                stargazers_count: 18,
                forks_count: 5,
                watchers_count: 18,
                updated_at: '2026-01-10T09:15:00Z',
                topics: ['data-visualization', 'd3js', 'typescript'],
                license: null
            },
            {
                name: 'api-gateway',
                html_url: 'https://github.com/harijaiswal29/api-gateway',
                description: 'Microservices API gateway with authentication',
                language: 'Go',
                stargazers_count: 67,
                forks_count: 20,
                watchers_count: 67,
                updated_at: '2026-01-05T18:45:00Z',
                topics: ['microservices', 'api', 'go', 'docker'],
                license: { name: 'MIT' }
            }
        ];

        // Fetch user profile
        async function fetchUserProfile() {
            try {
                if (USE_MOCK_DATA) {
                    displayUserProfile(MOCK_USER);
                    return;
                }
                
                const response = await fetch(`${GITHUB_API_BASE}/users/${GITHUB_USERNAME}`);
                if (!response.ok) throw new Error('Failed to fetch user profile');
                const user = await response.json();
                displayUserProfile(user);
            } catch (error) {
                console.error('Error fetching user profile:', error);
                // Fallback to mock data on error
                if (!USE_MOCK_DATA) {
                    console.log('Falling back to mock data');
                    displayUserProfile(MOCK_USER);
                }
            }
        }

        // Display user profile
        function displayUserProfile(user) {
            const profileContainer = document.getElementById('profile-container');
            profileContainer.innerHTML = `
                <div class="profile-section">
                    <img src="${user.avatar_url}" alt="${user.name || user.login}" class="profile-avatar">
                    <div class="profile-info">
                        <h2>${user.name || user.login}</h2>
                        <p>${user.bio || 'GitHub Developer'}</p>
                        ${user.location ? `<p>📍 ${user.location}</p>` : ''}
                        <div class="profile-stats">
                            <div class="stat">
                                <div class="stat-value">${user.public_repos}</div>
                                <div class="stat-label">Repositories</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${user.followers}</div>
                                <div class="stat-label">Followers</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${user.following}</div>
                                <div class="stat-label">Following</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Fetch all repositories
        async function fetchRepositories() {
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');
            const reposContainer = document.getElementById('repos-container');

            try {
                loadingEl.style.display = 'block';
                errorEl.style.display = 'none';
                reposContainer.innerHTML = '';

                if (USE_MOCK_DATA) {
                    allRepos = MOCK_REPOS;
                    displayRepositories(MOCK_REPOS);
                    loadingEl.style.display = 'none';
                    return;
                }

                let page = 1;
                let repos = [];
                let hasMore = true;

                // Fetch all pages of repositories
                while (hasMore) {
                    const response = await fetch(
                        `${GITHUB_API_BASE}/users/${GITHUB_USERNAME}/repos?per_page=100&page=${page}&sort=updated`
                    );
                    
                    if (!response.ok) {
                        throw new Error(`Failed to fetch repositories: ${response.status}`);
                    }

                    const pageRepos = await response.json();
                    repos = repos.concat(pageRepos);

                    if (pageRepos.length < 100) {
                        hasMore = false;
                    } else {
                        page++;
                    }
                }

                allRepos = repos;
                displayRepositories(repos);
                loadingEl.style.display = 'none';

            } catch (error) {
                console.error('Error fetching repositories:', error);
                loadingEl.style.display = 'none';
                
                // Fallback to mock data on error
                if (!USE_MOCK_DATA) {
                    console.log('Falling back to mock data');
                    allRepos = MOCK_REPOS;
                    displayRepositories(MOCK_REPOS);
                } else {
                    errorEl.style.display = 'block';
                    errorEl.textContent = `Error: ${error.message}. Please try again later.`;
                }
            }
        }

        // Display repositories
        function displayRepositories(repos) {
            const reposContainer = document.getElementById('repos-container');

            if (repos.length === 0) {
                reposContainer.innerHTML = '<div class="no-repos">No repositories found</div>';
                return;
            }

            reposContainer.innerHTML = repos.map(repo => {
                const updatedDate = new Date(repo.updated_at).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                return `
                    <div class="repo-card" onclick="window.open('${repo.html_url}', '_blank')">
                        <div class="repo-header">
                            <span class="repo-icon">📁</span>
                            <a href="${repo.html_url}" target="_blank" class="repo-name" onclick="event.stopPropagation()">
                                ${repo.name}
                            </a>
                        </div>
                        <p class="repo-description">
                            ${repo.description || 'No description provided'}
                        </p>
                        <div class="repo-meta">
                            ${repo.language ? `<div class="meta-item"><span class="language-badge">${repo.language}</span></div>` : ''}
                            <div class="meta-item">⭐ ${repo.stargazers_count}</div>
                            <div class="meta-item">🔱 ${repo.forks_count}</div>
                            <div class="meta-item">👁️ ${repo.watchers_count}</div>
                            ${repo.license ? `<div class="meta-item">📄 ${repo.license.name}</div>` : ''}
                        </div>
                        <div class="repo-meta">
                            <div class="meta-item">📅 Updated: ${updatedDate}</div>
                        </div>
                        ${repo.topics && repo.topics.length > 0 ? `
                            <div class="repo-topics">
                                ${repo.topics.map(topic => `<span class="topic-badge">${topic}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        // Search and filter repositories
        function filterRepositories(searchTerm) {
            const filtered = allRepos.filter(repo => {
                const term = searchTerm.toLowerCase();
                return (
                    repo.name.toLowerCase().includes(term) ||
                    (repo.description && repo.description.toLowerCase().includes(term)) ||
                    (repo.language && repo.language.toLowerCase().includes(term)) ||
                    (repo.topics && repo.topics.some(topic => topic.toLowerCase().includes(term)))
                );
            });
            displayRepositories(filtered);
        }

        // Event listeners
        document.getElementById('search-box').addEventListener('input', (e) => {
            filterRepositories(e.target.value);
        });

        // Initialize
        async function init() {
            await fetchUserProfile();
            await fetchRepositories();
        }

        init();
    </script>
</body>
</html>
